set_properties:
  name: Set device properties
  description: Send native BrizLabs properties to the light over local Bluetooth.
  fields:
    address:
      required: true
      selector:
        text:
    properties:
      required: true
      selector:
        object:
set_scene:
  name: Set scene
  description: Start a scene effect (scene_select protocol captured from the BrizLabs app).
  fields:
    address:
      required: true
      selector:
        text:
    effect:
      required: true
      description: Scene name, e.g. "Color Mixture", "C2 Steady On", "Loop", "Music".
      selector:
        text:
    brightness:
      description: Scene brightness 0-1000 (default 1000).
      selector:
        number:
          min: 0
          max: 1000
    mix:
      description: Colour-to-white balance 0-1000 (0 = full colour, 1000 = full white).
      selector:
        number:
          min: 0
          max: 1000
    speed:
      description: Animation speed 1-4 (0 for the steady scenes).
      selector:
        number:
          min: 0
          max: 4
    combine:
      description: Loop sequence as concatenated scene hex ids (e.g. "2021"); defaults to all scenes.
      selector:
        text:
